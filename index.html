<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Simple Website</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #1f2937; background: #f3f6fb; }
    header { padding: 1rem 6vw; display: flex; justify-content: space-between; align-items: center; background: white; }
    .logo { font-weight: 750; color: #2563eb; }
    nav a { margin-left: 1.25rem; color: #475569; text-decoration: none; }
    main { min-height: 75vh; display: grid; place-items: center; padding: 3rem 1.5rem; text-align: center; }
    .hero { max-width: 650px; }
    h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 7vw, 4.5rem); line-height: 1.05; }
    p { color: #64748b; font-size: 1.15rem; line-height: 1.7; }
    button { margin-top: 1rem; padding: .85rem 1.3rem; border: 0; border-radius: .6rem; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    footer { padding: 1.5rem; text-align: center; color: #64748b; }
    @media (max-width: 480px) {
      header { align-items: flex-start; gap: .75rem; flex-direction: column; }
      nav a { margin: 0 1rem 0 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">My Website</div>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero">
      <h1>A simple page for your big ideas.</h1>
      <p>Welcome to my website. This is a clean starting point—replace this text with whatever you’d like to share.</p>
      <button type="button" onclick="document.querySelector('#about').scrollIntoView({ behavior: 'smooth' })">
        Learn more
      </button>
    </section>
  </main>

  <footer id="about">Made with care · <span id="year"></span></footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
